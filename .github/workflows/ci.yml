name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Introspection functions
        run: uv run python smoke_test.py

      - name: Analysis tools
        run: uv run python analysis_test.py

      - name: Server over the real MCP transport
        run: uv run python client_test.py

      - name: CLI exit codes
        run: bash exitcheck.sh

      # Builds a throwaway venv, installs Django and this package into it, and
      # drives both the CLI and the MCP server with that interpreter. This is
      # the install path docs/usage.md tells people to use, so it is verified
      # rather than assumed.
      - name: Documented install path
        run: bash install_check.sh

      - name: API contract lifecycle
        run: bash contract_check.sh

      - name: Coverage, with a floor
        run: bash coverage_check.sh

      - name: Documentation covers the code
        run: bash docs_check.sh

      - name: Call graph
        run: bash callgraph_check.sh

      - name: Escaping side effects
        run: bash oncommit_check.sh

  oldest-django:
    # The tool reads the app registry, so the Django version it runs against is
    # part of its contract. 4.2 is still LTS and widely deployed; claiming
    # support for it in the classifiers without testing it would be a guess.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: A target project on Django 4.2 LTS
        run: |
          python -m venv /tmp/target
          /tmp/target/bin/pip install -q --upgrade pip
          /tmp/target/bin/pip install -q "django~=4.2.0" djangorestframework .
          /tmp/target/bin/python -c "import django; print(django.get_version())"

      - name: The analysis has to run there too
        env:
          DJANGO_CHAINSAW_PROJECT_PATH: testprojects
          DJANGO_CHAINSAW_SETTINGS_MODULE: demoshop.settings
        run: |
          /tmp/target/bin/django-chainsaw models --short
          # demoshop ships an unsafe migration, so a clean exit would be wrong.
          if /tmp/target/bin/django-chainsaw check --tenant-root shop.Customer; then
            echo "expected findings on the demo project"
            exit 1
          fi

  dogfood:
    # The analyser run against its own demo project, which is the closest
    # thing to a real target this repository has.
    runs-on: ubuntu-latest
    env:
      DJANGO_CHAINSAW_PROJECT_PATH: testprojects
      DJANGO_CHAINSAW_SETTINGS_MODULE: demoshop.settings

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      - name: Model graph
        run: uv run django-chainsaw models --short

      - name: Migration risk (reporting only)
        run: uv run django-chainsaw migrations

      # demoshop deliberately ships a blocking migration, so this is expected
      # to exit 1. Anywhere else the step would simply be `django-chainsaw
      # deploy-safety` with no negation.
      - name: Deploy safety must flag the planted blocking migration
        run: |
          if uv run django-chainsaw deploy-safety; then
            echo "expected exit 1, the demo project has an unsafe migration"
            exit 1
          fi
